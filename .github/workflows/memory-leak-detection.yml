name: Memory Leak Detection
on:
  workflow_dispatch:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  memory-leak-detection:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Without this uv reads .python-version and runs 3.13 in every leg.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_PREFERENCE: only-system

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          build-essential \
          cmake \
          ninja-build \
          fonts-dejavu-core

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --dev --locked

    - name: Verify interpreter
      run: |
        got=$(uv run --no-sync python -c "import sys; print('%d.%d' % sys.version_info[:2])")
        echo "venv python: $got"
        [ "$got" = "${{ matrix.python-version }}" ] || { echo "FAIL: expected ${{ matrix.python-version }}"; exit 1; }

    - name: Build pymui
      run: |
        uv build

    - name: Install built package
      run: |
        uv pip install dist/*.whl

    # --no-sync: a plain `uv run` reinstalls the editable project over the wheel.
    - name: Run test suite
      run: |
        uv run --no-sync pytest -q
      env:
        SDL_VIDEODRIVER: dummy
        PYTHONFAULTHANDLER: 1

    - name: Run memory leak detection
      run: |
        uv run --no-sync python scripts/memory_leak_test.py --verbose
      env:
        # Ensure proper cleanup and error reporting
        PYTHONFAULTHANDLER: 1

    - name: Run memory leak detection with higher iterations
      if: github.event_name == 'schedule'  # Only on nightly runs
      run: |
        uv run --no-sync python scripts/memory_leak_test.py --verbose --iterations 2000
      env:
        PYTHONFAULTHANDLER: 1

    - name: Run performance benchmarks with memory monitoring
      run: |
        # Run performance tests to catch performance-related memory issues
        uv run --no-sync python scripts/benchmark.py

    - name: Upload memory leak results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: memory-leak-results-python-${{ matrix.python-version }}
        path: |
          memory_*.log
          core.*
        retention-days: 7

  valgrind-analysis:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[valgrind]')
    env:
      # Valgrind reports carry file:line only when the extension keeps symbols.
      CFLAGS: "-g -O0"
      CXXFLAGS: "-g -O0"
      # Without this uv reads .python-version and ignores setup-python.
      UV_PYTHON: "3.11"
      UV_PYTHON_PREFERENCE: only-system

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install system dependencies including Valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          build-essential \
          cmake \
          ninja-build \
          valgrind \
          python3-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --dev --locked

    - name: Verify interpreter
      run: |
        got=$(uv run --no-sync python -c "import sys; print('%d.%d' % sys.version_info[:2])")
        echo "venv python: $got"
        [ "$got" = "3.11" ] || { echo "FAIL: expected 3.11"; exit 1; }

    - name: Build pymui with debug symbols
      run: |
        uv build

    - name: Install built package
      run: |
        uv pip install dist/*.whl

    - name: Run Valgrind memory analysis
      run: |
        uv run --no-sync valgrind \
          --tool=memcheck \
          --leak-check=full \
          --show-leak-kinds=all \
          --track-origins=yes \
          --log-file=valgrind_output.log \
          python scripts/valgrind_test.py
      env:
        # pymalloc's arena reuse hides per-object allocations from memcheck.
        PYTHONMALLOC: malloc

    - name: Check Valgrind results
      run: |
        uv run --no-sync python scripts/check_valgrind.py valgrind_output.log

    - name: Upload Valgrind results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: valgrind-analysis-results
        path: valgrind_output.log
        retention-days: 14